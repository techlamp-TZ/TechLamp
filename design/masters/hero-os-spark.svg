  Resting state shown (signal settled at the base, ripple faded).</desc>
  <g inkscape:groupmode="layer" inkscape:label="source" id="tl-hero-os-spark-source">
    <circle cx="13" cy="9" r="5.5" fill="#ff6200"/>
    <circle cx="13" cy="9" r="2" fill="#ffd7a8"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="rail" id="layer-rail">
    <line x1="13" y1="16" x2="13" y2="52" stroke="#e3dcd4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="signal" id="tl-hero-os-spark-signal">
    <circle cx="13" cy="50" r="3.6" fill="#ff5a00"/>
  </g>
  <path d="M 9 55 L 13 59 L 17 55" fill="none" stroke="#ff5a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
