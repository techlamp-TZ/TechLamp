<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 26 64" width="26" height="64">
  <title>hero-os-spark</title>
  <desc>Artwork master for the hero signal handoff: the system emits one signal that
