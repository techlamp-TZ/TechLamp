<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 380 240" width="380" height="240">
  <title>contact-human-loop</title>
  <desc>Closing reassurance scene: a visitor's enquiry arrives at a TechLamp specialist,
  who works under the lamp and maps the next step. Human judgment stays visible. Integrated
  inline in src/features/contact/ContactHumanLoop.tsx; this file is the editable record.</desc>

  <g inkscape:groupmode="layer" inkscape:label="enquiry" id="tl-contact-human-loop-enquiry">
    <rect x="10" y="120" width="74" height="46" rx="12" fill="#f7dfce" stroke="#3a1c0d" stroke-width="2"/>
    <path d="M 26 166 L 26 180 L 42 166 Z" fill="#f7dfce" stroke="#3a1c0d" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 24 136 H 68 M 24 148 H 58" stroke="#3a1c0d" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="rails" id="layer-rails">
    <path d="M 86 150 H 150" fill="none" stroke="#e3dcd4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 86 150 H 120" fill="none" stroke="#ff5a00" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
    <circle cx="120" cy="150" r="6" fill="#ff5a00"/>
    <path d="M 240 150 H 346" fill="none" stroke="#e3dcd4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 338 143 L 350 150 L 338 157" fill="none" stroke="#3a1c0d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="150" r="7" fill="#1f6f47"/>
    <path d="M 296.5 150 L 299 152.5 L 303.5 147.5" fill="none" stroke="#fffdfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="lamp" id="tl-contact-human-loop-lamp">
    <circle cx="196" cy="54" r="44" fill="#ffd7a8" opacity="0.5"/>
    <path d="M 196 8 A 34 34 0 0 1 214 86 L 178 86 A 34 34 0 0 1 196 8 Z" fill="#fffdfc" stroke="#682800" stroke-width="2.4"/>
    <path d="M 186 30 L 200 48 L 189 53 L 203 72" fill="none" stroke="#ff6200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="182" y="88" width="28" height="7" rx="3.5" fill="#682800"/>
    <rect x="186" y="99" width="20" height="7" rx="3.5" fill="#682800"/>
    <path d="M 196 108 V 118" stroke="#f0c9a6" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="specialist" id="tl-contact-human-loop-person">
    <circle cx="196" cy="162" r="40" fill="#fffdfc" stroke="#3a1c0d" stroke-width="2.4"/>
    <circle cx="196" cy="150" r="13" fill="#0e0d0c"/>
    <path d="M 174 186 A 22 22 0 0 1 218 186 Z" fill="#0e0d0c"/>
    <g transform="translate(226,132)">
      <circle r="14" fill="#1f6f47"/>
      <path d="M -6 0 L -1.8 4.4 L 6.6 -6" fill="none" stroke="#fffdfc" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
